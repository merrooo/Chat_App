name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify structure
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== capacitor.config.json webDir ==="
          node -e "console.log(require('./capacitor.config.json').webDir)" || true
          echo "=== android folder ==="
          ls -la android/ | head -10

      - name: Ensure webDir has index.html
        run: |
          WEB_DIR=$(node -e "process.stdout.write(require('./capacitor.config.json').webDir.replace(/^\.\//,''))")
          if [ ! -s "$WEB_DIR/index.html" ]; then
            echo "ERROR: $WEB_DIR/index.html is missing or empty."
            echo "Run scripts/Configure-App.ps1 and commit the generated index.html."
            exit 1
          fi
          echo "OK: $(wc -c < "$WEB_DIR/index.html") bytes"

      # postinstall syncs through the Capacitor JS entry point; index.html must exist by now.
      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor
        run: npm run sync:android

      - name: Verify web assets synced into android/
        run: |
          TEST_FILE="android/app/src/main/assets/public/index.html"
          if [ ! -s "$TEST_FILE" ]; then
            echo "ERROR: $TEST_FILE missing or empty — cap sync did not copy webDir"
            ls -la android/app/src/main/assets/public/ || true
            exit 1
          fi
          echo "OK: $TEST_FILE = $(wc -c < "$TEST_FILE") bytes"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Build signed APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          APP_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          ./gradlew assembleRelease bundleRelease --stacktrace \
            -PappVersionCode="$APP_VERSION_CODE" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Remove keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Copy APK and Play bundle
        run: |
          mkdir -p dist
          APP_NAME="$(node -e "process.stdout.write(require('./capacitor.config.json').appName)")"
          SAFE_NAME="$(printf '%s' "$APP_NAME" | tr -cs 'A-Za-z0-9._-' '-')"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${SAFE_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/${SAFE_NAME}.aab"
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload Play bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Play-AAB
          path: dist/*.aab
          if-no-files-found: error

      - name: Read Play publishing metadata
        id: play-metadata
        run: |
          echo "package_name=$(node -e "process.stdout.write(require('./capacitor.config.json').appId)")" >> "$GITHUB_OUTPUT"
          echo "release_name=$(node -e "process.stdout.write(require('./capacitor.config.json').appName)") build $GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.play-metadata.outputs.package_name }}
          releaseFiles: dist/*.aab
          tracks: internal
          status: completed
          releaseName: ${{ steps.play-metadata.outputs.release_name }}

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true