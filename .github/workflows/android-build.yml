name: Build & Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify structure
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" | head -5
          echo "=== Chat folder ==="
          ls -la Chat/
          echo "=== android folder ==="
          ls -la android/ | head -10

      - name: Ensure Chat.html exists
        run: |
          if [ ! -f Chat/index.html ]; then
            if [ -f Chat/Chat.html ]; then
              cp Chat/Chat.html Chat/index.html
              echo "Copied Chat.html -> index.html"
            else
              echo "ERROR: no Chat.html or index.html in Chat/"
              ls -la Chat/
              exit 1
            fi
          fi
          ls -la Chat/

      - name: Install npm deps
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund